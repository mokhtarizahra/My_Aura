services:
  mongodb:
    image: mongo:7
    container_name: my-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: my-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/my_aura
      - JWT_SECRET=supersecretkey
      - JWT_EXPIRE=15m
      - REFRESH_JWT_EXPIRE=7d
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - SMS_API_KEY=OCsXCoz4agzU0GffDtagXFBFDGGKaznrt26f6PnxnCdHF2Lk
      - SMS_TEMPLATE_ID=123456
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: my-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: